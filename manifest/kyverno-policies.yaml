apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kro2026-disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [kro2026]
      validate:
        message: "kro2026 네임스페이스에서는 이미지 태그로 latest를 사용할 수 없습니다."
        pattern:
          spec:
            containers:
              - image: "!*:latest"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kro2026-require-managed-by-label
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-managed-by-kro
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [kro2026]
      validate:
        message: "kro2026 네임스페이스의 Pod는 app.kubernetes.io/managed-by: kro label이 있어야 합니다."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kro
